services:
  api:
    build: .
    image: coldchain-closure-checker:latest
    ports:
      - "8000:8000"
    environment:
      # 附件归档根目录（持久卷挂载点）
      ARCHIVE_DIR: /data/archive
    volumes:
      - archive-data:/data/archive
    depends_on:
      sample-site:
        condition: service_started
    networks:
      - closure-net

  sample-site:
    build: ./sample-site
    image: closure-sample-site:latest
    ports:
      - "8080:8080"
    networks:
      - closure-net

networks:
  closure-net:
    driver: bridge

volumes:
  archive-data:
